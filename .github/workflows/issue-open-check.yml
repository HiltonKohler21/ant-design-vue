name: Issue Open Check

# Disabled automatic issue trigger for internal fork; manual dispatch only
on:
  workflow_dispatch: {}


permissions:
  contents: read

jobs:
  issue-open-check:
    permissions:
      contents: read  # for visiky/dingtalk-release-notify to get latest release
      issues: write  # for actions-cool/issues-helper to update issues
      pull-requests: write  # for actions-cool/issues-helper to update PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions-cool/check-user-permission@v1.0.0
        id: checkUser
        with:
          require: 'write'

      - name: check invalid
        if: (contains(github.event.issue.body, 'issue-helper') == false) && (steps.checkUser.outputs.result == 'false') 
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'create-comment,add-labels,close-issue'
          issue-number: ${{ github.event.issue.number }}
          labels: 'Invalid'
          body: |
            Hello @${{ github.event.issue.user.login }}, your issue has been closed because it does not conform to our issue requirements. Please check [GitHub Issues](https://github.com/HiltonKohler21/ant-design-vue/issues) to provide reproduction details, thank you!

            你好 @${{ github.event.issue.user.login }}，为了能够进行高效沟通，我们对 issue 有一定的格式要求，你的 issue 因为不符合要求而被自动关闭。你可以通过 [GitHub Issues](https://github.com/HiltonKohler21/ant-design-vue/issues) 提供复现信息并重新提交。谢谢配合！
