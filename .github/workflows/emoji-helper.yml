name: Emoji Helper

# Disabled automatic release trigger for internal fork; manual dispatch only
on:
  workflow_dispatch: {}

jobs:
  emoji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions-cool/emoji-helper@v1.0.0
        with:
          type: 'release'
          emoji: '+1, laugh, heart, hooray, rocket, eyes'
